# Tokyo Night theme for tmux
# Self-contained, palette-driven status line. Matches NvChad's `tokyonight`
# (base46) so the editor and the surrounding tmux chrome share one palette.
# Assumes a Nerd Font is available (Ghostty, iTerm2, Alacritty, etc.).
# If you attach from a terminal without Nerd Font glyphs (e.g. Termius
# over SSH), wrap the icons in a #{?#{==:#{client_termname},...}} guard.
#
# Everything below references the @thm_* palette via #{E:@thm_*}, so a future
# re-theme is a single edit to the palette block — no hex hunting in the
# status strings.

# ── Tokyo Night palette ─────────────────────────────────────────────────────────────────
# Values taken from base46/themes/tokyonight.lua (NvChad).
set -g @thm_base    "#1a1b26"
set -g @thm_mantle  "#1d1e29"
set -g @thm_crust   "#16161e"
set -g @thm_surface_0 "#24283b"
set -g @thm_surface_1 "#353b45"
set -g @thm_surface_2 "#414868"
set -g @thm_overlay_0 "#40486a"
set -g @thm_overlay_1 "#4f5779"
set -g @thm_overlay_2 "#565f89"
set -g @thm_text    "#c0caf5"
set -g @thm_subtext_0 "#545c7e"
set -g @thm_subtext_1 "#a9b1d6"
set -g @thm_red     "#f7768e"
# Orange rather than a salmon: the suspended pill has to stay distinct from the
# prefix pill, and tokyonight's pinks sit too close to @thm_red.
set -g @thm_maroon  "#ff9e64"
set -g @thm_green   "#9ece6a"
set -g @thm_yellow  "#e0af68"
set -g @thm_blue    "#7aa2f7"
set -g @thm_mauve   "#bb9af7"
set -g @thm_teal    "#1abc9c"
set -g @thm_sky     "#7dcfff"

# ── Status icons ───────────────────────────────────────
# Every Nerd Font glyph lives here. The status strings below stay pure ASCII
# (they reference these via #{E:@icon_*}), so theme/layout edits never touch
# — or re-munge — the glyphs. Needs a Nerd Font in the terminal.
set -g @icon_session        ""          # U+E795  session / terminal
set -g @icon_suspended      "󰏤"          # U+F03E4 pause
set -g @icon_host           "󰒋"          # U+F048B host
set -g @icon_clock          "󰃰"          # U+F00F0 clock

# ── Status bar general ────────────────────────────────────────────────────────────────
set -g status-position top
set -g status-style "bg=#{@thm_base},fg=#{@thm_text}"
set -g status-left-length 100
set -g status-right-length 100

# ── Status left: session pill ────────────────────────────────────────────────────
# Session pill changes color and icon to signal state, keeping geometry fixed:
#   normal     → green pill, terminal icon
#   prefix     → red pill, terminal icon
#   suspended  → maroon pill, pause icon
set -g status-left "#[fg=#{?#{==:#{client_key_table},suspended},#{E:@thm_maroon},#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}}]#[fg=#{E:@thm_crust},bg=#{?#{==:#{client_key_table},suspended},#{E:@thm_maroon},#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}}]#{?#{==:#{client_key_table},suspended}, #{E:@icon_suspended} , #{E:@icon_session} }#[fg=#{E:@thm_text},bg=#{E:@thm_surface_0}] #S #[fg=#{E:@thm_surface_0},bg=#{E:@thm_base}] "

# ── Status right: host + date/time ─────────────────────────────────────────────────────
set -g status-right "#[fg=#{E:@thm_blue}]#[fg=#{E:@thm_crust},bg=#{E:@thm_blue}] #{E:@icon_host} #[fg=#{E:@thm_text},bg=#{E:@thm_surface_0}] #H #[fg=#{E:@thm_surface_0},bg=#{E:@thm_base}] #[fg=#{E:@thm_sky}]#[fg=#{E:@thm_crust},bg=#{E:@thm_sky}] #{E:@icon_clock} #[fg=#{E:@thm_text},bg=#{E:@thm_surface_0}] %Y-%m-%d %H:%M #[fg=#{E:@thm_surface_0},bg=#{E:@thm_base}]"

# ── Window status (inactive) ─────────────────────────────────────────────────────────
set -g window-status-format "#[fg=#{E:@thm_crust},bg=#{E:@thm_overlay_2}] #I #[fg=#{E:@thm_text},bg=#{E:@thm_surface_0}] #W #[fg=#{E:@thm_surface_0},bg=#{E:@thm_base}] "

# ── Window status (active / current) ───────────────────────────────────────────────────
set -g window-status-current-format "#[fg=#{E:@thm_crust},bg=#{E:@thm_blue}] #I #[fg=#{E:@thm_text},bg=#{E:@thm_surface_1}] #W #[fg=#{E:@thm_surface_1},bg=#{E:@thm_base}] "

# ── Window status separator ────────────────────────────────────────────────────────
set -g window-status-separator ""

# ── Pane borders ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#{@thm_surface_0}"
set -g pane-active-border-style "fg=#{@thm_blue}"

# ── Message / command prompt ────────────────────────────────────────────────────────
set -g message-style "bg=#{@thm_surface_0},fg=#{@thm_text}"
set -g message-command-style "bg=#{@thm_surface_0},fg=#{@thm_text}"

# ── Mode (copy mode highlight, etc.) ─────────────────────────────────────────────────
set -g mode-style "bg=#{@thm_surface_2},fg=#{@thm_text}"
