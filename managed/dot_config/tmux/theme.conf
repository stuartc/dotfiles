# Catppuccin Macchiato theme for tmux
# Self-contained replacement for the Catppuccin tmux plugin.
# Assumes a Nerd Font is available (Ghostty, iTerm2, Alacritty, etc.).
# If you attach from a terminal without Nerd Font glyphs (e.g. Termius
# over SSH), wrap the icons in a #{?#{==:#{client_termname},...}} guard.

# ── Macchiato palette ───────────────────────────────────────────────────────────────────
set -g @thm_base    "#24273a"
set -g @thm_mantle  "#1e2030"
set -g @thm_crust   "#181926"
set -g @thm_surface_0 "#363a4f"
set -g @thm_surface_1 "#494d64"
set -g @thm_surface_2 "#5b6078"
set -g @thm_overlay_0 "#6e738d"
set -g @thm_overlay_1 "#8087a2"
set -g @thm_overlay_2 "#939ab7"
set -g @thm_text    "#cad3f5"
set -g @thm_subtext_0 "#a5adcb"
set -g @thm_subtext_1 "#b8c0e0"
set -g @thm_red     "#ed8796"
set -g @thm_maroon  "#ee99a0"
set -g @thm_green   "#a6da95"
set -g @thm_yellow  "#eed49f"
set -g @thm_blue    "#8aadf4"
set -g @thm_mauve   "#c6a0f6"
set -g @thm_teal    "#8bd5ca"
set -g @thm_sky     "#91d7e3"

# ── Status bar general ────────────────────────────────────────────────────────────────
set -g status-style "bg=#{@thm_base},fg=#{@thm_text}"
set -g status-left-length 100
set -g status-right-length 100

# ── Status left: session pill ────────────────────────────────────────────────────
# Session pill changes color and icon to signal state, keeping geometry fixed:
#   normal     → green pill, terminal icon
#   prefix     → red pill, terminal icon
#   suspended  → maroon pill, pause icon
set -g status-left "#[fg=#{?#{==:#{client_key_table},suspended},#{E:@thm_maroon},#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}}]#[fg=#181926,bg=#{?#{==:#{client_key_table},suspended},#{E:@thm_maroon},#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}}]#{?#{==:#{client_key_table},suspended}, 󰏤 ,  }#[fg=#cad3f5,bg=#363a4f] #S #[fg=#363a4f,bg=#{E:@thm_base}] "

# ── Status right: host + date/time ─────────────────────────────────────────────────────
set -g status-right "#[fg=#c6a0f6]#[fg=#181926,bg=#c6a0f6] 󰒋 #[fg=#cad3f5,bg=#363a4f] #H #[fg=#363a4f,bg=#{E:@thm_base}] #[fg=#91d7e3]#[fg=#181926,bg=#91d7e3] 󰃰 #[fg=#cad3f5,bg=#363a4f] %Y-%m-%d %H:%M#[fg=#363a4f,bg=#{E:@thm_base}]"

# ── Window status (inactive) ─────────────────────────────────────────────────────────
set -g window-status-format "#[fg=#181926,bg=#939ab7]  #I #[fg=#cad3f5,bg=#363a4f] #W #[fg=#363a4f,bg=#{E:@thm_base}] "

# ── Window status (active / current) ───────────────────────────────────────────────────
set -g window-status-current-format "#[fg=#181926,bg=#c6a0f6]  #I #[fg=#cad3f5,bg=#494d64] #W #[fg=#494d64,bg=#{E:@thm_base}] "

# ── Window status separator ────────────────────────────────────────────────────────
set -g window-status-separator ""

# ── Pane borders ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#{@thm_surface_0}"
set -g pane-active-border-style "fg=#{@thm_mauve}"

# ── Message / command prompt ────────────────────────────────────────────────────────
set -g message-style "bg=#{@thm_surface_0},fg=#{@thm_text}"
set -g message-command-style "bg=#{@thm_surface_0},fg=#{@thm_text}"

# ── Mode (copy mode highlight, etc.) ─────────────────────────────────────────────────
set -g mode-style "bg=#{@thm_surface_2},fg=#{@thm_text}"
