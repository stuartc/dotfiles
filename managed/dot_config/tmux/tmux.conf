# ── Terminal ─────────────────────────────────────────────────────────────────

# terminal-features describes the terminal tmux is running *inside*. Entries are
# matched per client against its $TERM and ignored otherwise, so listing several
# is safe; a blanket "*" would over-claim for weak SSH clients and corrupt
# output. usstyle = coloured/curly underlines, for nvim's undercurl.
set -g default-terminal "tmux-256color"
set -as terminal-features "xterm-ghostty:RGB:usstyle:clipboard:hyperlinks"
set -as terminal-features "xterm-256color:RGB:usstyle:clipboard:hyperlinks"

set -g focus-events on      # nvim's autoread/checktime hooks depend on these
set -g window-size latest   # size to the most recently active client

# CSI u — lets apps tell Ctrl/Shift+Enter apart from plain Enter
set -g extended-keys on
set -g extended-keys-format csi-u

# 0 (tmux-sensible's default) can split a bracketed paste over SSH: the \e
# arrives ahead of [200~ and nvim reads it as a bare ESC.
set -s escape-time 10

set -s set-clipboard on     # OSC 52
set -g allow-passthrough on # let apps send their own escapes through tmux
set -g mouse on

# host:session window, in the outer terminal's title bar
set -g set-titles on
set -g set-titles-string "#H:#S #W"

# ── Prefix ───────────────────────────────────────────────────────────────────

# Keep the second prefix inside F1–F12: tmux knows those natively, so they need
# no user-keys entry and reach a nested session on their own. F9 is right-cmd,
# remapped on the Keychron; F10–F12 are taken further down.
set -g prefix C-Space
set -g prefix2 F9
bind C-Space send-prefix
bind F9 send-prefix -2

# ── Windows ──────────────────────────────────────────────────────────────────

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind c new-window -c "#{pane_current_path}"
bind '`' last-window
set -s command-alias[100] nw='new-window -a -c "#{pane_current_path}"'  # prefix + : nw

# Cmd+Opt+[ / ] shuffles the current window along the tab bar; iTerm2 and
# Ghostty are both set to send these sequences. -d keeps focus on the moved
# window, so you can hold Cmd+Opt and tap to walk it across. prefix + < / > are
# tmux's own equivalents.
set -s user-keys[0] "\e[40~"
set -s user-keys[1] "\e[41~"
bind -n User0 swap-window -d -t -1
bind -n User1 swap-window -d -t +1

# tmux can't emit a UserN key back out to a pane, so while suspended re-send the
# raw bytes for the nested tmux to pick up.
bind -T suspended User0 send-keys -H 1b 5b 34 30 7e
bind -T suspended User1 send-keys -H 1b 5b 34 31 7e

# Move the current window to a position you type. Bubble-swaps its way there, so
# unlike the built-in move-window it accepts an index that's already occupied.
bind . command-prompt -p "move window to:" "run-shell '~/.bin/tmux-move-window %%'"

# ── Panes ────────────────────────────────────────────────────────────────────

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Sizes for the main-* preset layouts (prefix + M-3 / M-4)
set -g main-pane-width 60%
set -g main-pane-height 60%

# prefix + ! pops the current pane out to its own window (built in); J pulls one
# back in from a window you pick. -Z keeps this pane zoomed while you choose.
bind J choose-window -Z "join-pane -h -s '%%'"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# C-hjkl crosses pane and nvim-split boundaries alike. smart-splits.nvim sets
# @pane-is-vim while nvim has focus, which is why it must not be lazy-loaded.
# Resizing is driven from nvim's <leader>rr submode, so needs nothing here.
bind -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

bind C-l send-keys C-l   # clear-screen, displaced by the pane nav above

# ── Copy mode (vi keys) ──────────────────────────────────────────────────────

#   drag / y   copy, staying in copy mode so you keep your scroll position
#   click      exit copy mode
#   Space      start a selection, then hjkl/w/b/0/$/g/G to extend it
#   V / v      select the whole line / toggle block selection
#   Enter      copy and exit
#   q          exit without copying
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe
bind -T copy-mode-vi y send-keys -X copy-pipe

# ── Sessions ─────────────────────────────────────────────────────────────────

# sesh — session switcher, wired up only if it's installed
#   prefix + t   picker (^a all  ^t tmux  ^g configured  ^x zoxide  ^d kill)
#   prefix + L   last session
#   prefix + T   clock, displaced by `t`
#   F10          picker from any state; the suspended binding shadows a nested
#                tmux's root F10, so the outer one wins while it's suspended
if-shell 'command -v sesh >/dev/null 2>&1' {
    set -g detach-on-destroy off   # `sesh last` and kill-and-switch need this
    bind -N "last session" L run-shell "sesh last"
    bind T clock-mode
    bind t run-shell "~/.bin/tmux-sesh-picker"
    bind -T root F10 run-shell "~/.bin/tmux-sesh-picker"
    bind -T suspended F10 run-shell "~/.bin/tmux-sesh-picker"
}

# ── Notes ────────────────────────────────────────────────────────────────────

# prefix + N then d opens today's daily note. F11 does the same from a nested
# tmux, without resuming this one first.
bind N switch-client -T notes
bind -T notes d run-shell -b '~/.bin/tmux-daily-note'
bind -T suspended F11 run-shell -b '~/.bin/tmux-daily-note'

# ── Misc ─────────────────────────────────────────────────────────────────────

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# ── Plugins (TPM) ────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'MunifTanjim/tmux-suspend'

# F12 suspends this tmux so keys fall through to a nested one. tmux-suspend
# clears `prefix` by itself; anything else that would swallow a keypress has to
# be listed here. Never blank a user-key to do that — an empty user-key matches
# greedily and eats every key it's offered, the prefix included.
set -g @suspend_suspended_options " \
  prefix2::none, \
"

if "test ! -d $TMUX_PLUGIN_MANAGER_PATH" \
   "run 'git clone https://github.com/tmux-plugins/tpm $TMUX_PLUGIN_MANAGER_PATH && $TMUX_PLUGIN_MANAGER_PATH/bin/install_plugins'"

# Catppuccin Macchiato, with per-client Nerd Font detection
source-file ~/.config/tmux/theme.conf

run '$TMUX_PLUGIN_MANAGER_PATH/tpm'   # must stay last
