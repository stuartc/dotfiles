# Terminal & true color
#
# default-terminal = the modern inside-tmux TERM (italics + correct erase
# caps; the bare `screen` builtin breaks both). terminal-features tells
# tmux what the OUTSIDE terminal can do: RGB (24-bit colour, else tmux
# palette-crushes to 256), usstyle (coloured/curly underlines so nvim
# undercurl survives), clipboard (OSC 52), hyperlinks (OSC 8).
#
# Entries are matched per-client against the outside $TERM and are inert
# for any terminal that doesn't match — listing every terminal here is
# safe and is NOT a terminal-specific hack. A blanket "*" would instead
# over-claim caps for weak SSH clients (Termius) and cause corruption.
set -g default-terminal "tmux-256color"
set -as terminal-features "xterm-ghostty:RGB:usstyle:clipboard:hyperlinks"
set -as terminal-features "xterm-256color:RGB:usstyle:clipboard:hyperlinks"

# Forward terminal focus in/out to apps (nvim autoread/checktime on
# FocusGained depends on this) and size the window to the most-recently
# active client rather than letting a stale client constrain geometry.
set -g focus-events on
set -g window-size latest

# Terminal title — host:session window in the outer terminal's title bar
set -g set-titles on
set -g set-titles-string "#H:#S #W"

# Prefix
# Primary: C-Space. Secondary: F17 (right-cmd via Keychron Q1 Pro remap) so
# the prefix is reachable without a chord — pairs with caps→ctrl/esc to cut
# left-pinky load. tmux only knows F1–F12 natively, so F17–F19 are
# registered as user-keys whose escape sequences are emitted by both iTerm2
# (Keyboard Map in modify_private_com.googlecode.iterm2.plist) and Ghostty
# (`keybind`) — F13–F16 are skipped because macOS reserves F14/F15 as
# brightness keys at the HID layer and never delivers them to userspace.
unbind C-b
set -g prefix C-Space
set -s user-keys[0] "\e[31~"
set -s user-keys[1] "\e[32~"
set -s user-keys[2] "\e[33~"
# User3/User4: Cmd+Opt+[ / ] from iTerm2 (window shuffle, bound below). Outside
# the F17-20 CSI range so nothing on the Keychron can collide.
set -s user-keys[3] "\e[40~"
set -s user-keys[4] "\e[41~"
set -g prefix2 User0
bind C-Space send-prefix
bind User0 send-prefix -2

# Mouse
set -g mouse on

# Extended keys (CSI u protocol) — lets apps distinguish Ctrl/Shift+Enter etc.
set -g extended-keys on
set -g extended-keys-format csi-u

# Copy mode (vi-style, overrides tmux-sensible's copy-pipe-and-cancel)
#
# Mouse selection copies to clipboard but stays in copy mode so you keep
# your scroll position when browsing logs. Click anywhere to exit.
# tmux-sensible default was copy-pipe-and-cancel which snaps to the bottom.
#
# Mouse:
#   drag-select  → copies to clipboard, stays in copy mode
#   click        → exits copy mode
#
# Keyboard selection:
#   Space        → begin selection (then hjkl/w/b/0/$/g/G to extend)
#   V            → select entire line
#   v            → toggle rectangle (block) selection
#   y            → yank: copy selection, stay in copy mode
#   Enter        → copy selection and exit copy mode
#   q            → exit copy mode without copying
#
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe
bind -T copy-mode-vi y send-keys -X copy-pipe

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Stash & restore a pane
#   prefix + !  : break-pane (default) — pop the current pane out to its own window
#   prefix + J  : pick a window from a picker and pull its pane back in beside this one
# -Z keeps the current pane zoomed while you choose; %% is the picked window.
bind J choose-window -Z "join-pane -h -s '%%'"

# Shuffle the current window left/right along the tab bar (no prefix).
# Cmd+Opt+[ / ] in iTerm2 emit \e[40~ / \e[41~ (User3/User4); -d keeps focus on
# the moved window so you can hold Cmd+Opt and tap to walk it across. renumber-
# windows means its number follows. Mirrors the Cmd+Opt+Arrow pane-nav idiom.
bind -n User3 swap-window -d -t -1
bind -n User4 swap-window -d -t +1

# Default sizes for the main-* preset layouts (prefix + M-3 / M-4): the big
# "main" pane gets 60% of the width (main-vertical) or height (main-horizontal),
# leaving the rest to share what's left.
set -g main-pane-width 60%
set -g main-pane-height 60%

# Toggle to last-used window (alt-tab style; `l` is taken by pane nav)
bind '`' last-window

# --- smart-splits.nvim seamless navigation ---
# @pane-is-vim is set by the plugin while nvim is the focused app (and cleared
# on exit/suspend), so these root (-n) bindings only steal C-hjkl from a pane
# when nvim is NOT focused. This is why smart-splits must not be lazy-loaded.
# Resize is driven from nvim (<leader>rr submode), which shells out to
# `tmux resize-pane` at the layout edge — so no resize keybindings are needed here.
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

# Keep C-hjkl as pane navigation inside copy mode too
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Recover clear-screen: C-l is now navigation, so prefix + C-l clears
bind-key C-l send-keys C-l
# --- end smart-splits.nvim ---

# Command aliases (use from prefix + :)
set -s command-alias[100] nw='new-window -a -c "#{pane_current_path}"'

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Prevent bracketed paste splitting over SSH (tmux-sensible sets 0, which
# can cause \e to arrive before [200~ and get interpreted as ESC in nvim)
set -s escape-time 10

# Clipboard - OSC 52
set -s set-clipboard on
set -g allow-passthrough on

# Notes key table — prefix + N enters "notes" mode, then:
#   d = open today's daily note
bind N switch-client -T notes
bind -T notes d run-shell -b '~/.bin/tmux-daily-note'

# Daily note shortcut from inside nested tmux (suspended state)
# F11 = quick daily note without manually resuming first
bind -T suspended F11 run-shell -b '~/.bin/tmux-daily-note'

# sesh — smart session switcher (only wired up if installed)
#   prefix + L : toggle last session
#   prefix + t : picker (outer not suspended)
#   prefix + T : clock (default `t` re-homed since sesh took it)
#   F10        : picker, works regardless of suspend state; the
#                suspended-table binding shadows the inner tmux's root F10
#                so the outer always gets it when its own outer is suspended
#   F18 (User1): same as F10 (Keychron Q1 Pro fn+pgup remap)
# ^a all  ^t tmux only  ^g configured  ^x zoxide  ^d kill highlighted
if-shell 'command -v sesh >/dev/null 2>&1' {
    # Required so `sesh last` and kill-and-switch behave correctly
    set -g detach-on-destroy off
    bind -N "last session" L run-shell "sesh last"
    bind-key T clock-mode
    bind-key t run-shell "~/.bin/tmux-sesh-picker"
    bind -T root F10 run-shell "~/.bin/tmux-sesh-picker"
    bind -T suspended F10 run-shell "~/.bin/tmux-sesh-picker"
    bind -T root User1 run-shell "~/.bin/tmux-sesh-picker"
    bind -T suspended User1 run-shell "~/.bin/tmux-sesh-picker"
}

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'MunifTanjim/tmux-suspend'

# tmux-suspend only clears `prefix`; without these, the outer keeps
# grabbing F17 while suspended. Two layers must go: prefix2 stops it
# *acting* as a prefix, but user-keys[0] is what *captures* the \e[31~
# bytes into a synthetic User0 — leaving that mapping live means the
# outer swallows F17 (dropping the now-unbound User0) so it never
# tunnels through ssh to a nested session. Clearing it lets the bytes
# pass through for the inner tmux to translate itself.
set -g @suspend_suspended_options " \
  prefix2::none, \
  user-keys[0]::, \
"

if "test ! -d $TMUX_PLUGIN_MANAGER_PATH" \
   "run 'git clone https://github.com/tmux-plugins/tpm $TMUX_PLUGIN_MANAGER_PATH && $TMUX_PLUGIN_MANAGER_PATH/bin/install_plugins'"

# Theme (Catppuccin Macchiato with per-client Nerd Font detection)
source-file ~/.config/tmux/theme.conf

run '$TMUX_PLUGIN_MANAGER_PATH/tpm'

