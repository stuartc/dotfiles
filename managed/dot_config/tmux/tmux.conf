# Terminal & true color
# set -g default-terminal "tmux-256color"
# set -as terminal-features ",xterm-256color:RGB"

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Mouse
set -g mouse on

# Copy mode (vi-style, overrides tmux-sensible's copy-pipe-and-cancel)
#
# Mouse selection copies to clipboard but stays in copy mode so you keep
# your scroll position when browsing logs. Click anywhere to exit.
# tmux-sensible default was copy-pipe-and-cancel which snaps to the bottom.
#
# Mouse:
#   drag-select  → copies to clipboard, stays in copy mode
#   click        → exits copy mode
#
# Keyboard selection:
#   Space        → begin selection (then hjkl/w/b/0/$/g/G to extend)
#   V            → select entire line
#   v            → toggle rectangle (block) selection
#   y            → yank: copy selection, stay in copy mode
#   Enter        → copy selection and exit copy mode
#   q            → exit copy mode without copying
#
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe
bind -T copy-mode-vi y send-keys -X copy-pipe

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Command aliases (use from prefix + :)
set -s command-alias[100] nw='new-window -a -c "#{pane_current_path}"'

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Clipboard - OSC 52 (works over SSH from iTerm2)
set -s set-clipboard on
set -g allow-passthrough on
set -as terminal-features ',xterm-256color:clipboard'

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'MunifTanjim/tmux-suspend'

# Catppuccin - macchiato to match Ghostty theme
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "basic"

# Window indicators: dot circle for active, circle for inactive
set -g @catppuccin_window_number " #I"
set -g @catppuccin_window_current_number " #I"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_flags "none"

# Force square edges on current window (overrides stale rounded values)
set -g @catppuccin_window_current_left_separator " "
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator " "

# Status line - square edges and padded icons on modules
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_host_icon " 󰒋 "
set -g @catppuccin_date_time_icon " 󰃰 "
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{?#{==:#{client_key_table},suspended},#[bg=red#,fg=white#,bold] SUSPENDED #[bg=#{@thm_green}] ,}#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

if "test ! -d $TMUX_PLUGIN_MANAGER_PATH" \
   "run 'git clone https://github.com/tmux-plugins/tpm $TMUX_PLUGIN_MANAGER_PATH && $TMUX_PLUGIN_MANAGER_PATH/bin/install_plugins'"

run '$TMUX_PLUGIN_MANAGER_PATH/tpm'

