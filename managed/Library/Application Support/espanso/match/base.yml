matches:
  # Date in YYYY.MM.DD format
  - trigger: ";date"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y.%m.%d"

  - trigger: ";ddate"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y-%m-%d"

  - trigger: ";sdate"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y/%m/%d"

  # ISO week number (01-53)
  - trigger: ";week"
    replace: "{{week}}"
    vars:
      - name: week
        type: date
        params:
          format: "%V"

  - trigger: ";sec"
    replace: "§"

  - trigger: ";emd"
    replace: "—"

  # Reactions / status
  - trigger: ";tu"
    replace: "👍"
  - trigger: ";td"
    replace: "👎"
  - trigger: ";ok"
    replace: "✅"
  - trigger: ";no"
    replace: "❌"
  - trigger: ";eyes"
    replace: "👀"
  - trigger: ";pray"
    replace: "🙏"
  - trigger: ";100"
    replace: "💯"
  - trigger: ";fire"
    replace: "🔥"
  - trigger: ";tada"
    replace: "🎉"
  - trigger: ";rocket"
    replace: "🚀"

  # Thinking / commentary
  - trigger: ";think"
    replace: "🤔"
  - trigger: ";shrug"
    replace: "🤷"
  - trigger: ";facepalm"
    replace: "🤦"
  - trigger: ";sweat"
    replace: "😅"
  - trigger: ";laugh"
    replace: "😂"

  # Dev / ops
  - trigger: ";bug"
    replace: "🐛"
  - trigger: ";wip"
    replace: "🚧"
  - trigger: ";warn"
    replace: "⚠️"
  - trigger: ";lock"
    replace: "🔒"
  - trigger: ";key"
    replace: "🔑"
  - trigger: ";sparkle"
    replace: "✨"
  - trigger: ";ship"
    replace: "🚢"
  - trigger: ";wave"
    replace: "👋"
